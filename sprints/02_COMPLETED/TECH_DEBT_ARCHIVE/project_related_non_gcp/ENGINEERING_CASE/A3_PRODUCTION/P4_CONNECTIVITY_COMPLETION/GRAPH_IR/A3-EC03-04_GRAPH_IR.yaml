source_linkage_status: LINKED

primary_engineering_question: >-
  How do Direct Connectivity and Edge Aggregation compare across the fifteen
  canonical criteria, while preserving both as unselected architectural alternatives?

what_it_means: >-
  The matrix exposes criterion-specific differences between two plausible,
  co-applicable conceptual topology alternatives so later validation and decision
  work can be evidence-led.

what_it_does_not_mean: >-
  It does not recommend a winner, select a topology, establish deployment,
  instantiate identities or equipment, or provide a cost comparison.

reference_building:
  id: SEM-MCD-001
  label: "Semey, Shakarima 13A"
  role: REFERENCE_CONTEXT_ONLY
  installed_devices_confirmed: 0
  actual_installed_device_presence: NOT_ESTABLISHED
  zero_confirmed_means_proved_absence: false

semantic_entities:
  alternatives:
    - id: ALT-DIRECT
      name: DIRECT CONNECTIVITY
      status: PLAUSIBLE_ALTERNATIVE
      selected: false
    - id: ALT-EDGE
      name: EDGE AGGREGATION
      status: PLAUSIBLE_ALTERNATIVE
      selected: false
  rating_vocabulary:
    canonical: [LOW, MEDIUM, HIGH, TBD]
    source_preserved_qualifiers: [MEDIUM_HIGH, HIGHER, NONE, NOT_APPLICABLE]
  alternative_relationship:
    co_applicable: true
    sequential: false
    selection: NOT_SELECTED
    winner_declared: false

comparison_rows:
  - row_id: CMP-01
    criterion: Operator-facing connectivity identity count
    direct: "HIGH — one per device"
    edge: "LOW — one per aggregation group"
    source_ref: "EC-03 §28"
  - row_id: CMP-02
    criterion: Device independence
    direct: "HIGH — each device operates without dependency on another local device"
    edge: "LOW — devices depend on the shared aggregation function's availability"
    source_ref: "EC-03 §28"
  - row_id: CMP-03
    criterion: Local power dependency
    direct: "LOW — only the device itself needs power"
    edge: "MEDIUM–HIGH — aggregation function also needs power; exact value TBD pending site survey"
    source_ref: "EC-03 §28"
  - row_id: CMP-04
    criterion: Buffering
    direct: "Per-device (distributed)"
    edge: "Centralized at aggregation function or still per-device — TBD"
    source_ref: "EC-03 §28"
  - row_id: CMP-05
    criterion: Aggregation
    direct: "Not applicable"
    edge: "Native to this pattern"
    source_ref: "EC-03 §28"
  - row_id: CMP-06
    criterion: Physical distribution
    direct: "Devices spread across building without a common local node"
    edge: "Devices cluster around a common local node"
    source_ref: "EC-03 §28"
  - row_id: CMP-07
    criterion: Maintenance complexity
    direct: "MEDIUM — more individual connectivity endpoints to manage"
    edge: "MEDIUM — fewer connectivity endpoints, one added local component to maintain"
    source_ref: "EC-03 §28"
  - row_id: CMP-08
    criterion: Lifecycle complexity
    direct: "MEDIUM — device lifecycle only"
    edge: "MEDIUM–HIGH — device plus aggregation-function lifecycle"
    source_ref: "EC-03 §28"
  - row_id: CMP-09
    criterion: Failure-domain size
    direct: "LOW per device — isolated failure"
    edge: "HIGHER for group — aggregation-function failure affects all devices behind it"
    cross_ref: "EC-03 §29 F-03"
    source_ref: "EC-03 §28"
  - row_id: CMP-10
    criterion: Single-point-of-failure exposure
    direct: LOW
    edge: "HIGHER — aggregation function is a candidate single point of failure for its group"
    source_ref: "EC-03 §28"
  - row_id: CMP-11
    criterion: Local protocol dependency
    direct: "NONE — no local link required"
    edge: "TBD — unspecified local link required between devices and aggregation function"
    source_ref: "EC-03 §28"
  - row_id: CMP-12
    criterion: Operator visibility
    direct: "Per-device connectivity state"
    edge: "Per-aggregation-group connectivity state; device-level detail potentially reduced"
    source_ref: "EC-03 §28"
  - row_id: CMP-13
    criterion: Site-survey dependency
    direct: "Per-device location only"
    edge: "Per-device location plus aggregation-function location and local-link feasibility"
    source_ref: "EC-03 §28"
  - row_id: CMP-14
    criterion: Scalability
    direct: "MEDIUM — each additional device adds its own connectivity identity"
    edge: "HIGH within cluster — devices can join existing aggregation function without new external connectivity identities"
    source_ref: "EC-03 §28"
  - row_id: CMP-15
    criterion: Replacement impact
    direct: "LOW — replacing one device does not affect others"
    edge: "MEDIUM — replacing aggregation function could affect all devices behind it; replacing one device does not"
    source_ref: "EC-03 §28"

