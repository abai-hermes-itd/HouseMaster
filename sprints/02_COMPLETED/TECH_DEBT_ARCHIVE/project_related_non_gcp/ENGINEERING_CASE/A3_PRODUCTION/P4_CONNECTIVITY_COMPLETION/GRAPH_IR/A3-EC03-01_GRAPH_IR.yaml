provenance_time_semantics:
  - id: TIME-01
    rule: event_time != received_time
    meaning: Original observation time is preserved across buffered/delayed delivery.
    source_refs: ["EC-03 §23"]
  - id: PROV-01
    rule: delivered_observation_requires_domain_validation
    meaning: Network delivery does not establish evidence validity or engineering truth.
    source_refs: ["EC-03 §22", "EC-03 §24"]

