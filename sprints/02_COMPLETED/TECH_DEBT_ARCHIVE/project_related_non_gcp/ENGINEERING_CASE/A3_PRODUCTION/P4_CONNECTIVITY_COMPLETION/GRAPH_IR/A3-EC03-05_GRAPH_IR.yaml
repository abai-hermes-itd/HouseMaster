primary_engineering_question: >-
  How should HouseMaster represent connectivity state and interpret reachability
  evidence without treating proposed HouseMaster states as Beeline internal
  network states or inferring an engineering condition from transport silence alone?

primary_semantic_unit:
  type: CONNECTIVITY_STATE
  count: 7
  transition_model_defined: false

secondary_semantic_unit:
  type: REACHABILITY_KNOWLEDGE_CONDITION
  count: 4

reference_object:
  id: SEM-MCD-001
  label: "г. Семей, пр. Шакарима, 13 «А»"
  role: SOURCE_PROVENANCE_ANCHOR_ONLY
  installed_device_inference: PROHIBITED

responsibility_domains:
  - id: DOMAIN-HOUSEMASTER
    owner: HOUSEMASTER
    role: INTEGRATION_STATE_AND_DOMAIN_INTERPRETATION_OWNER
    responsibilities:
      - proposed_connectivity_state_vocabulary
      - permitted_knowledge_semantics
      - domain_interpretation
      - evidence_gating
  - id: DOMAIN-BEELINE
    owner: BEELINE
    role: CONNECTIVITY_TRANSPORT_DOMAIN
    boundary_rule: HOUSEMASTER_STATES_NOT_ASSERTED_AS_BEELINE_INTERNAL_NETWORK_STATES
    implementation_details: NOT_ESTABLISHED

planes:
  applicable: false
  count: 0
  reason: "EC-03 §21 and §24 do not specify a DATA / CONTROL / OPERATIONS plane decomposition for this page."

trust_access_boundary:
  included: false
  applicability: NOT_APPLICABLE_TO_SOURCE_SCOPE
  reason: "Trust / Access boundary detail is not present in EC-03 §21 or §24."

connectivity_states:
  - state_id: CS-01
    name: UNKNOWN
    status: PROPOSED_HOUSEMASTER_INTEGRATION_STATE
    meaning: "No connectivity information has ever been received for this device/profile."
  - state_id: CS-02
    name: PROVISIONED
    status: PROPOSED_HOUSEMASTER_INTEGRATION_STATE
    meaning: "A connectivity profile has been conceptually associated with a device, but reachability has not yet been confirmed."
  - state_id: CS-03
    name: REACHABLE
    status: PROPOSED_HOUSEMASTER_INTEGRATION_STATE
    meaning: "The device's connectivity path is currently confirmed responsive."
  - state_id: CS-04
    name: UNREACHABLE
    status: PROPOSED_HOUSEMASTER_INTEGRATION_STATE
    meaning: "The device's connectivity path is currently not responding; cause is not yet classified."
  - state_id: CS-05
    name: DEGRADED
    status: PROPOSED_HOUSEMASTER_INTEGRATION_STATE
    meaning: "The connectivity path is responsive but exhibiting reduced quality, such as delayed delivery, without being fully unreachable."
  - state_id: CS-06
    name: SUSPENDED
    status: PROPOSED_HOUSEMASTER_INTEGRATION_STATE
    meaning: "Connectivity has been intentionally paused by administrative action; this is not a fault."
  - state_id: CS-07
    name: DECOMMISSIONED
    status: PROPOSED_HOUSEMASTER_INTEGRATION_STATE
    meaning: "The device/connectivity profile has been retired and is no longer expected to report."

reachability_conditions:
  - condition_id: RC-01
    condition: NO_ENGINEERING_OBSERVATION_RECEIVED
    label: "No engineering observation received"
    observation_state: "No new data since last known state"
    housemaster_may_know: "No update has arrived."
    housemaster_must_not_infer: "The underlying engineering condition is unchanged, healthy, or failed."
  - condition_id: RC-02
    condition: DEVICE_UNREACHABLE
    label: "Device unreachable"
    observation_state: "Connectivity path not responding"
    housemaster_may_know: "The connectivity path is down."
    housemaster_must_not_infer: "The physical device or engineering component has failed."
  - condition_id: RC-03
    condition: DEVICE_REACHABLE_NO_ENGINEERING_EVENT
    label: "Device reachable but no engineering event"
    observation_state: "Connectivity confirmed responsive, but no telemetry/event content"
    housemaster_may_know: "The transport path itself is functioning."
    housemaster_must_not_infer: >-
      Absence of an event necessarily means normal; silence may be expected for
      event-driven candidates, while for continuous/periodic candidates it may
      indicate an unclassified device or interface issue.
  - condition_id: RC-04
    condition: DEVICE_REACHABLE_OBSERVATION_DELIVERED
    label: "Device reachable and observation delivered"
    observation_state: "Connectivity and content both confirmed"
    housemaster_may_know: "The reported value/event is available for domain interpretation."
    housemaster_must_not_infer: >-
      The delivered value is automatically a verified engineering fact; it
      remains subject to Observation → Symptom → Defect gating.

relationships:
  - {relationship_id: REL-01, from: RC-01, to: RC-01-OBSERVATION, type: HAS_OBSERVATION_STATE}
  - {relationship_id: REL-02, from: RC-01, to: RC-01-MAY-KNOW, type: PERMITS_KNOWLEDGE}
  - {relationship_id: REL-03, from: RC-01, to: RC-01-MUST-NOT-INFER, type: PROHIBITS_INFERENCE}
  - {relationship_id: REL-04, from: RC-02, to: RC-02-OBSERVATION, type: HAS_OBSERVATION_STATE}
  - {relationship_id: REL-05, from: RC-02, to: RC-02-MAY-KNOW, type: PERMITS_KNOWLEDGE}
  - {relationship_id: REL-06, from: RC-02, to: RC-02-MUST-NOT-INFER, type: PROHIBITS_INFERENCE}
  - {relationship_id: REL-07, from: RC-03, to: RC-03-OBSERVATION, type: HAS_OBSERVATION_STATE}
  - {relationship_id: REL-08, from: RC-03, to: RC-03-MAY-KNOW, type: PERMITS_KNOWLEDGE}
  - {relationship_id: REL-09, from: RC-03, to: RC-03-MUST-NOT-INFER, type: PROHIBITS_INFERENCE}
  - {relationship_id: REL-10, from: RC-04, to: RC-04-OBSERVATION, type: HAS_OBSERVATION_STATE}
  - {relationship_id: REL-11, from: RC-04, to: RC-04-MAY-KNOW, type: PERMITS_KNOWLEDGE}
  - {relationship_id: REL-12, from: RC-04, to: RC-04-MUST-NOT-INFER, type: PROHIBITS_INFERENCE}

