  - {guardrail_id: GR-02, text: "NO UPDATE ≠ UNCHANGED / HEALTHY / FAILED ENGINEERING CONDITION", source_ref: "EC-03 §24"}
  - {guardrail_id: GR-03, text: "UNREACHABLE CONNECTIVITY PATH ≠ FAILED PHYSICAL DEVICE OR ENGINEERING COMPONENT", source_ref: "EC-03 §24"}
  - {guardrail_id: GR-04, text: "REACHABLE WITH NO EVENT ≠ NECESSARILY NORMAL", source_ref: "EC-03 §24"}
  - {guardrail_id: GR-05, text: "DELIVERED OBSERVATION ≠ VERIFIED ENGINEERING FACT", source_ref: "EC-03 §24"}
  - {guardrail_id: GR-06, text: "NO HEARTBEAT INTERVAL / TIMEOUT / POLLING FREQUENCY IS DEFINED", source_ref: "EC-03 §24"}

