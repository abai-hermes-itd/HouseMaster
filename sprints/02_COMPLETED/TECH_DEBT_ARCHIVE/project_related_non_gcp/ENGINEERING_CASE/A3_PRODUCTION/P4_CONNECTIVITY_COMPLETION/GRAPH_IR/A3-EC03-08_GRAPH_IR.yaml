guardrails:
  - {guardrail_id: GR-01, text: "DEVICE CANDIDATE ≠ INSTALLED DEVICE"}
  - {guardrail_id: GR-02, text: "L1 — NOT READY ≠ PROVED ABSENCE"}
  - {guardrail_id: GR-03, text: "CONCEPTUAL ARCHITECTURE READY ≠ IMPLEMENTED OR DEPLOYED"}
  - {guardrail_id: GR-04, text: "DIRECT-FRIENDLY / EDGE-FRIENDLY / BOTH PLAUSIBLE / TBD = PLAUSIBILITY, NOT TOPOLOGY SELECTION"}
  - {guardrail_id: GR-05, text: "CONNECTIVITY PROFILE ≠ SIM / TARIFF / APN / VPN / NETWORK TECHNOLOGY / OPERATOR PRODUCT"}
  - {guardrail_id: GR-06, text: "UPLINK + DOWNLINK ≠ ENGINEERING ACTUATION"}
