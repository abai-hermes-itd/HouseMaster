  - {status: READY, meaning: "Conceptual architecture readiness only; not implemented or deployed."}
  - {status: "L1 — NOT READY", meaning: "Physical readiness is not established; this is not proof of absence."}
  - {status: DIRECT-FRIENDLY, meaning: "Direct plausibility classification; not a selection."}
  - {status: EDGE-FRIENDLY, meaning: "Edge plausibility classification; not a selection."}
  - {status: BOTH_PLAUSIBLE, meaning: "Both Direct and Edge are plausible; co-applicable and not sequential."}
  - {status: TBD, meaning: "Pattern class unresolved for DEV-CAND-014."}
  - {status: NOT_SELECTED, meaning: "No final topology is selected for any candidate."}
  - {status: NOT_ESTABLISHED, meaning: "Implementation or validation ownership is absent from assigned source scope."}

