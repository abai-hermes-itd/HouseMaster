core_thesis:
  statement: OBSERVABILITY ≠ SENSORIZATION
  supporting_statement: HouseMaster starts with the engineering question that requires evidence, not with a sensor.
  source_ref: EC-02 §3 / §4a / §18 A3-EC02-01
  confidence: N/A_META
  what_it_means: A physical condition is observable when context, an observation point, an appropriate channel, provenance, and acceptance can form a defensible HouseMaster record.
  what_it_does_not_mean: Observability does not require an installed device, complete sensor coverage, or selected connectivity.

canonical_observability_chain:
  sequence:
    - REAL_BUILDING
    - SYSTEM_COMPONENT_ZONE_CONTEXT
    - PHYSICAL_CONDITION
    - OBSERVATION_POINT
    - OBSERVATION_CHANNEL
    - OBSERVATION
    - PROVENANCE_CONTEXT_GATE
    - EVIDENCE
    - DOMAIN_PROFESSIONAL_VALIDATION
    - DOMAIN_INTERPRETATION
    - BUILDING_STATE
  conditional_branch:
    from: DOMAIN_INTERPRETATION
    to: DEFECT
    condition: DOMAIN_RULES_PASS
  sequence_note: Preserves the explicit EC-02 evidence and validation gates; no direct physical-condition-to-state inference is allowed.

narrative_blocks:
  - id: NB-01
    question: WHAT IS OBSERVABILITY?
    source_ref: EC-02 §1 / §3 / §4a / §18
    confidence: N/A_META
    what_it_means: A physical condition can be associated with engineering context, an observation point, a channel, time/source context, provenance, and an accepted HouseMaster record.
    what_it_does_not_mean: Full sensor coverage or installed hardware is not required.
  - id: NB-02
    question: WHAT IS AN OBSERVATION POINT?
    source_ref: EC-02 §3 / §3.1 / §4
    confidence: N/A_META
    what_it_means: A physical or engineering concept attached to a building, system, component, zone, place, or condition where an observation may be made.
    what_it_does_not_mean: It is not a device, installation claim, or known physical location.
  - id: NB-03
    question: HOW DO HUMAN AND MACHINE CHANNELS COEXIST?
    source_ref: EC-02 §4a.1-§4a.3 / §14.1 / §15.x
    confidence: N/A_META
    what_it_means: Human and Machine channels are co-applicable, non-sequential, and not mutually exclusive.
    what_it_does_not_mean: Human is not fallback-only; Machine is not mandatory.
  - id: NB-04
    question: WHEN DOES AN OBSERVATION BECOME EVIDENCE?
    source_ref: EC-02 §4a / §14.1 / §16.1-§16.2
    confidence: N/A_META
    what_it_means: Only after required object context and provenance criteria pass; domain or professional validation remains a separate gate.
    what_it_does_not_mean: An incoming observation is not automatically evidence, defect, or building state.
  - id: NB-05
    question: WHY DOES CONNECTIVITY NOT EQUAL ENGINEERING STATE?
    source_ref: EC-02 §4a.3 / §11 / §15.y / §16.2 / §17
    confidence: N/A_META
    what_it_means: Connectivity transports machine-channel observations and can expose an evidence gap.
    what_it_does_not_mean: Connectivity status cannot prove engineering condition or component failure.
  - id: NB-06
    question: WHAT REMAINS UNKNOWN OR CANDIDATE ON SEM-MCD-001?
    source_ref: EC-02 §3.1 / §8 / §10 / §12 / §13
    confidence: MIXED_VERIFIED_PARTIAL_TBD_NO_EVIDENCE
    what_it_means: Candidates remain evidence-gated and require site validation before physical siting.
    what_it_does_not_mean: Page composition does not close locations, installation, coverage, constraints, or connectivity feasibility.

