acceptance_model:
  sequence:
    - OBSERVATION
    - PROVENANCE_CONTEXT_GATE
    - EVIDENCE_IF_CRITERIA_PASS
    - DOMAIN_PROFESSIONAL_VALIDATION
    - DEFECT_OR_BUILDING_STATE_IF_RULES_PASS
  source_ref: EC-02 §4a / §14 / §16.1-§16.2
  housemaster_role:
    - owns observation and evidence semantics
    - anchors records to building and engineering context
    - preserves provenance
    - accepts or rejects records through domain rules
    - maintains engineering-domain history and state
  collapse_stages: false

