supporting_rules:
  - HUMAN OBSERVATION ≠ MACHINE DEPENDENCE
  - OBSERVATION ≠ EVIDENCE
  - EVIDENCE ≠ DEFECT
  - UNKNOWN ≠ ABSENT
  - CONNECTIVITY STATE ≠ ENGINEERING STATE
  - NO EVENT ≠ NORMAL CONDITION
  - TBD LOCATION ≠ NO PHYSICAL COMPONENT

