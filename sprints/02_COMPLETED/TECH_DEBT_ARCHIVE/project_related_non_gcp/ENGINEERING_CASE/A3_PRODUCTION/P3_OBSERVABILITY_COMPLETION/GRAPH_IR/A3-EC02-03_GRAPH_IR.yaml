core_thesis:
  statement: MASTER OBSERVABILITY MATRIX ≠ DEVICE DEPLOYMENT PLAN
  source_ref: EC-02 §15 / §18 A3-EC02-03 plus owner-approved page thesis
  what_it_means: The register describes source-backed engineering conditions, conceptual observation channels, evidence needs, validation gates, and unresolved implementation inputs.
  what_it_does_not_mean: It does not prove devices are installed, locations are confirmed, full building observability is achieved, or connectivity design is selected.

