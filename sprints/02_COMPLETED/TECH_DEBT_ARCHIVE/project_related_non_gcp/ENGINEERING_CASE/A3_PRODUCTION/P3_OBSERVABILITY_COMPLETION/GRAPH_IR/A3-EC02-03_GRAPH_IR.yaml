    confirmed_count: 0
    actual_presence_status: NOT_ESTABLISHED
    absence_proved: false
  exact_observation_point_location_count: 0
  matrix_row_coverage_proves_full_building_observability: false

channel_model:
  count: 2
  relationship: CO_APPLICABLE_NOT_SEQUENTIAL_NOT_MUTUALLY_EXCLUSIVE
  human:
    included: true
    forms:
      - inspection
      - checklist
      - manual reading
      - visual assessment
      - photo
      - note
      - act
      - documentary record
    fallback_only: false
    lower_trust_by_default: false
  machine:
    included: true
    status: CONCEPTUAL_CAPABILITY_ONLY
    functions:
      - measure
      - timestamp
      - state_or_event_capture
      - buffer
      - forward
    does_not_infer:
      - selected sensor
      - hardware vendor
      - installed device
      - mounting point
      - local protocol
      - SIM identity
      - RF result
      - API
      - sampling interval
      - threshold
      - coverage

observation_point_status_model:
  L0: NO_CANDIDATE_WITHOUT_UNDERLYING_EVIDENCE
  L1: CONCEPTUAL_CANDIDATE_SYSTEM_OR_ZONE_EXISTS_LOCATION_UNKNOWN
  L2: SITEABLE_CANDIDATE_SPECIFIC_LOCATION_DOCUMENTED
  L3: FIELD_INSTANTIATED_LOCATION_CONFIRMED
  current_matrix_row_status: L1_CONCEPTUAL_CANDIDATE
  l2_plus_siteable_confirmed_count: 0

provenance_template: &provenance_template "Retain claim/observation, building/object context, system/component/zone context, Observation Point, channel, event_time, recorded/received time, actor/source/device identity where applicable, attachment/record where applicable, source reference, confidence, and validation status; do not invent values."

time_model:
  event_time_equals_recorded_received_time: false
  no_event_proves_normal_condition: false
  no_new_observation_proves_unchanged_engineering_state: false

evidence_model:
  observation_equals_evidence: false
  evidence_equals_defect: false
  evidence_admission: PROVENANCE_AND_CONTEXT_CRITERIA_MUST_PASS
  engineering_interpretation: DOMAIN_PROFESSIONAL_VALIDATION_GATED

connectivity_boundary:
  token_if_machine: REQUIRED_TBD_DOWNSTREAM_VALIDATION
  machine_applicability_may_require_connectivity: true
  topology_selected: false
  direct_or_edge_selected: false
  sim_defined: false
  network_defined: false
  rf_defined: false
  api_defined: false

matrix_columns:
