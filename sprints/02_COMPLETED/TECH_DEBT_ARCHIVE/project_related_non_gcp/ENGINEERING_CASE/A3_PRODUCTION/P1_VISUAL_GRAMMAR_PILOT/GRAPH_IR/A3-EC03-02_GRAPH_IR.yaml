    source_ref: "EC-03 §26"
    what_it_means: "The candidate requires the listed functions"
    what_it_does_not_mean: "A sensor/product implementation is selected"

  - id: E-06
    from: S-06
    to: S-07
    label: "associates transport requirements"
    status: CANDIDATE
    source_ref: "EC-03 §17; §26"
    what_it_means: "Device functions are paired with CP-CAND-001 requirements"
    what_it_does_not_mean: "A SIM or operator product is assigned"

  - id: E-07
    from: S-07
    to: S-08
    label: "applies direct reference pattern"
    status: BOTH_PLAUSIBLE_NOT_SELECTED
    source_ref: "EC-03 §25; §26"
    what_it_means: "Direct is shown as a plausible reference pattern"
    what_it_does_not_mean: "Edge Aggregation is invalid or Direct is selected"

  - id: E-08
    from: S-08
    to: S-09
    label: "enters operator access / transport"
    status: CONCEPTUAL_TBD
    source_ref: "EC-03 §9a; §26"
    what_it_means: "The direct pattern uses conceptual Beeline access/transport"
    what_it_does_not_mean: "RF, provisioning, technology, product, or internal topology is known"

  - id: E-09
    from: S-09
    to: S-10
    label: "crosses trust / integration boundary"
    status: REFERENCED
    source_ref: "EC-03 §9a–§9a.1; §26"
    what_it_means: "Connectivity responsibility hands off toward HouseMaster ingestion"
    what_it_does_not_mean: "SIM validity establishes trusted engineering state"

  - id: E-10
    from: S-10
    to: S-11
    label: "enters HouseMaster integration edge"
    status: REFERENCED_NOT_IMPLEMENTED
    source_ref: "EC-03 §9a; §26"
    what_it_means: "Data reaches the conceptual HouseMaster integration edge"
    what_it_does_not_mean: "An endpoint, API, schema, or protocol is implemented"

  - id: E-11
    from: S-11
    to: S-12
    label: "authenticates / validates / normalizes / maps conceptually"
    status: CONCEPTUAL
    source_ref: "EC-03 §9a; §26"
    what_it_means: "HouseMaster-side integration can produce canonical observation content"
