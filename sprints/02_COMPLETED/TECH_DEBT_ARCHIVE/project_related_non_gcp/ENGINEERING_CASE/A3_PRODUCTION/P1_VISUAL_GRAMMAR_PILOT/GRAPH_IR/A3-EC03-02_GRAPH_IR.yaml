  - id: E-12
    from: S-12
    to: S-13
    label: "attaches evidence context"
    status: PROVENANCE_REQUIRED
    source_ref: "EC-03 §26"
    what_it_means: "Observation becomes evidence-bearing"
    what_it_does_not_mean: "Observation and evidence are identical or evidence proves defect"

  - id: E-13
    from: S-13
    to: S-14
    label: "supports rules-gated building-state interpretation"
    status: DOMAIN_RULE_GATED
    source_ref: "EC-03 §22; §24; §26"
    what_it_means: "Evidence can support Building State through domain interpretation"
    what_it_does_not_mean: "Network health, connectivity restoration, or evidence automatically proves building health"

guardrails:
  - "DEVICE IDENTITY ≠ SIM IDENTITY"
  - "CONNECTIVITY STATE ≠ ENGINEERING STATE"
  - "DEVICE OFFLINE ≠ COMPONENT FAILED"
  - "VALID SIM ≠ TRUSTED ENGINEERING STATE"

counts:
