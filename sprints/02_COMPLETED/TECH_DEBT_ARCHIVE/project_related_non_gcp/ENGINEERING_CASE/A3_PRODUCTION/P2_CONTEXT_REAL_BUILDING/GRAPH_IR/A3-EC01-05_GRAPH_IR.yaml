confidence_vocabulary:
  interpretation_axis: EPISTEMIC_EVIDENCE_STATE
  severity_axis: false
  states:
    - state: VERIFIED
      meaning: Directly supported at the stated scope.
    - state: DERIVED
      meaning: Explicitly derived from source-backed facts; not a direct source fact.
    - state: PARTIAL
      meaning: Some evidence exists, but scope, completeness, or confirmation remains limited.
    - state: ASSIGNED
      meaning: Owner-approved taxonomy or project decision; not independently re-derived.
    - state: DISPUTED / OPEN
      meaning: Conflicting or unresolved claims remain controlled and unclosed.
    - state: TBD
      meaning: Information is not established and requires validation.
    - state: NO EVIDENCE
      meaning: Reviewed evidence does not support the claim; absence is not proved.

