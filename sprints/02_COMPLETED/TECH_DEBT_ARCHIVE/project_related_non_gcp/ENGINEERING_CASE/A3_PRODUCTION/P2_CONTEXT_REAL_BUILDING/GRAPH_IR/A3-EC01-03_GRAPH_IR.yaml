    unresolved_items:
      - EXACT_LEGAL_OR_SITE_BOUNDARY_NOT_ESTABLISHED
      - EXACT_FOOTPRINT_REMAINS_TBD

footprint:
  label: EXACT BUILDING FOOTPRINT AREA
  status: NOT_ESTABLISHED_TBD
  source_ref: EC-01 §4 / BF-008 / TBD-001
  may_be_derived_from_area_values: false
  closure_requirement:
    - ORIGINAL_DIMENSIONED_PLAN
    - AUTHORITATIVE_GEOMETRY
    - FIELD_SURVEY

geometry:
  label: STEPPED / NON-RECTANGULAR GEOMETRY
  status: PARTIAL
  source_ref: EC-01 §4 / BF-009
  shape_evidence: VERIFIED
  full_dimension_set: PARTIAL
  closed_by_area_taxonomy: false

non_equivalence_model:
  arithmetic_hierarchy_asserted: false
  area_summation_allowed: false
  ratios_allowed: false
  conflict_between_6403_8_and_15020: false
  relationships:
    - left: AREA-01
      relation: NOT_EQUAL_SEMANTIC_CATEGORY
      right: AREA-02
      statement: TOTAL USEFUL AREA ≠ COMMON / SHARED AREA
    - left: AREA-03
      relation: NOT_EQUAL_SEMANTIC_CATEGORY
      right: AREA-04
      statement: CADASTRAL BUILDING AREA ≠ ADJACENT TERRITORY
    - left: ALL_AREA_CATEGORIES
      relation: DO_NOT_ESTABLISH
      right: EXACT_BUILDING_FOOTPRINT
      statement: AREA CATEGORY ≠ FOOTPRINT
    - left: ANY_AREA_VALUE
      relation: DOES_NOT_VERIFY
      right: GEOMETRY
      statement: AREA VALUE ≠ VERIFIED GEOMETRY

provenance_model:
  included: true
  sequence:
    - AREA_CLAIM
    - CATEGORY
    - SOURCE
    - STATUS
    - VALIDATION_REQUIREMENT
  category_assignment_may_promote_source_status: false
  verified_figure_may_verify_geometry: false

guardrails:
  - AREA CATEGORY ≠ FOOTPRINT
  - CADASTRAL BUILDING AREA ≠ ADJACENT TERRITORY
  - TOTAL USEFUL AREA ≠ COMMON / SHARED AREA
  - AREA VALUE ≠ VERIFIED GEOMETRY
  - TAXONOMY ≠ SITE SURVEY

forbidden_actions:
  - treat_distinct_categories_as_conflicting_measurements
  - infer_footprint_from_area_values
  - infer_site_boundary_from_15020
  - calculate_common_area_ratio
  - reinterpret_assigned_taxonomy
  - calculate_hidden_geometry
  - sum_area_categories
  - create_drawio
  - create_pdf
  - create_3d

source_control:
  allowed_source: EC-01_REAL_MCD_BASELINE_SEM-MCD-001_v0.3_REVIEW.md
  required_sections_only: true
  source_reread_outside_required_ec01_context: false
