reference_anchor:
  id: SEM-MCD-001
  address: Semey, Shakarima 13A
  included: true

purpose: >-
  Explain the area semantics of SEM-MCD-001 and prevent distinct area
  categories from being misread as conflicting measurements, arithmetic
  components, footprint values, or verified geometry.

canonical_rule:
  statement: THESE FOUR FIGURES ≠ FOUR COMPETING MEASUREMENTS OF ONE AREA
  meaning: The four figures describe different semantic area categories.

counts:
  area_categories: 4
  guardrails: 5

area_categories:
