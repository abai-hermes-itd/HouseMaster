    source_status: ASSIGNED
    provenance:
      source_ref: EC-01 §0b / §5.0 / BF-027
      source_type: OWNER_APPROVED_PROJECT_BASELINE_TAXONOMY
      independently_rederived: false
    what_it_means:
      - Common/shared building-area category under the approved taxonomy.
    what_it_does_not_mean:
      - TOTAL_USEFUL_BUILDING_AREA
      - EXACT_BASEMENT_AREA
      - BUILDING_FOOTPRINT
    validation_status: TAXONOMY_FIXED_NOT_INDEPENDENTLY_REDERIVED
    unresolved_items:
      - EXACT_BASEMENT_AREA_TBD
      - EXACT_FOOTPRINT_REMAINS_TBD

  - area_id: AREA-03
    value: 6403.8
    display_value: 6,403.8 m²
    unit: m²
    canonical_label: CADASTRAL BUILDING AREA
    semantic_scope: Cadastral building-area category associated with the building record.
    source_status: VERIFIED_FIGURE_CATEGORY_PER_OWNER_APPROVED_TAXONOMY
