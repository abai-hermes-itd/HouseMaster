    value: 1248
    display_value: 1,248 m²
    unit: m²
    canonical_label: TOTAL USEFUL BUILDING AREA
    semantic_scope: Total useful area of the building as fixed in the approved taxonomy.
    source_status: ASSIGNED
    provenance:
      source_ref: EC-01 §0b / §5.0 / BF-026
      source_type: OWNER_APPROVED_PROJECT_BASELINE_TAXONOMY
      independently_rederived: false
    what_it_means:
      - Total useful area of the building under the approved taxonomy.
    what_it_does_not_mean:
      - BUILDING_FOOTPRINT
      - COMMON_AREA_ONLY
      - LAND_PARCEL_AREA
    validation_status: TAXONOMY_FIXED_NOT_INDEPENDENTLY_REDERIVED
    unresolved_items:
      - EXACT_FOOTPRINT_REMAINS_TBD

  - area_id: AREA-02
    value: 550
