      - ADJACENT_TERRITORY
      - TOTAL_USEFUL_AREA
    validation_status: FIGURE_VERIFIED_FOOTPRINT_NOT_VALIDATED
    unresolved_items:
      - EXACT_FOOTPRINT_SITE_COVERAGE_TBD_001

