generic_template_distinction:
  included: true
  canonical_statement: VALIDATED REFERENCE BUILDING ≠ GENERIC TEMPLATE
  building_specific_evidence_must_persist: true
  unresolved_items_must_persist: true

guardrails:
  - REAL BUILDING ≠ GENERIC TEMPLATE
  - VISUAL REALISM ≠ VERIFIED DATA
  - UNKNOWN ≠ ABSENT
  - 3D GEOMETRY ≠ SOURCE OF TRUTH
  - REPEATABLE PATTERN ≠ IDENTICAL BUILDINGS

guardrail_semantics:
  - statement: REAL BUILDING ≠ GENERIC TEMPLATE
    means: SEM-MCD-001 is the validation anchor, not universal geometry.
  - statement: VISUAL REALISM ≠ VERIFIED DATA
    means: Rendering quality or apparent realism cannot promote evidence confidence.
  - statement: UNKNOWN ≠ ABSENT
    means: TBD or unresolved component, geometry, or location information does not prove that the physical entity does not exist.
  - statement: 3D GEOMETRY ≠ SOURCE OF TRUTH
    means: 3D or semantic representation remains constrained by evidence and provenance.
  - statement: REPEATABLE PATTERN ≠ IDENTICAL BUILDINGS
    means: Validated architectural learning may generalize without asserting that other MCDs have identical geometry, systems, topology, or installation constraints.

secondary_rules:
  - AREA TAXONOMY ≠ BUILDING FOOTPRINT
  - SYSTEM EXISTS ≠ COMPONENT LOCATION KNOWN
  - CANDIDATE DEVICE / OBSERVATION POINT ≠ INSTALLED DEVICE

